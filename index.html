<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose a game and start playing from the game hub.">
  <title>Playful Game Hub</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="hub-page">
  <audio id="landing-music" src="assets/music/AI%20for%20Beauty.mp3" loop preload="auto" autoplay playsinline></audio>
  <main class="hub-shell">
    <section class="hub-stage">
      <div class="game-entry-wrap">
        <a class="game-entry" href="games/corgi-run/" aria-label="Start Hundi-Run">
          <img src="assets/images/corgi-run-card.png" alt="Hundi-Run game card with a corgi jumping in a sunny garden.">
        </a>
        <p class="game-entry-name">Hundi-Run</p>
      </div>
      <div class="game-entry-wrap">
        <a class="game-entry" href="games/princess-star-adventure/" aria-label="Start Princess Star Adventure">
          <img src="assets/images/princess-magic-card.png" alt="Princess Star Adventure fantasy platform game card.">
        </a>
        <p class="game-entry-name">Princess Star Adventure</p>
      </div>
    </section>
  </main>
  <script type="module" src="src/landing.js"></script>
</body>
</html>
